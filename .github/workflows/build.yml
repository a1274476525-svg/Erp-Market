name: Build and type-check

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
      - "audit/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/umarket.db
      - name: Type-check and build renderer and Electron
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/umarket.db
